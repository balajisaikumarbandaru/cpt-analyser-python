[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cpt-analyser"
version = "0.1.0"
description = "Cone penetration test (CPT) reader and interpreter: GEF / GME / Excel / CSV input, Robertson SBT, layers, dissipation tests, plots and exports. Python version of the single-file HTML CPT Analyser."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.6", "openpyxl>=3.0", "pandas>=1.5"]
keywords = ["CPT", "CPTu", "cone penetration test", "geotechnical", "GEF", "Robertson", "soil behaviour type"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
app = ["streamlit>=1.50"]
dev = ["pytest>=7", "ruff"]
parity = ["mini-racer"]  # tools/compare_with_html.py

[project.scripts]
cpt-analyser = "cpt_analyser.cli:main"

[project.urls]
"HTML version" = "https://github.com/balajisaikumarbandaru/cpt-analyser"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# closures inside loops are called immediately (same structure as the JavaScript original)
ignore = ["B023", "E731", "B905", "E741", "B007"]  # I, L are the usual CPT symbols
